[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrdms"
dynamic = ["version"]
description = "PDF-Stapel automatisch trennen, per OCR durchsuchbar machen und mit Ollama für Paperless verschlagworten"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "pymupdf>=1.26",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "cryptography>=43",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pystray>=0.19",
    "pillow>=10",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.10"]

[project.gui-scripts]
ocrdms = "ocrdms.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "ocrdms.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocrdms = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
